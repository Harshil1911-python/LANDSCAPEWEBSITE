<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline - {{ s.pwa_name if s and s.pwa_name else 'atom landscape' }}</title>
<meta name="theme-color" content="#22c55e">
<style>
body{font-family:system-ui,sans-serif;background:#f0fdf4;color:#1e293b;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{text-align:center;max-width:360px}
h1{font-size:1.5rem;margin:0 0 .5rem}
p{color:#64748b;margin:0 0 1.5rem;line-height:1.5}
.btn{display:inline-block;background:#22c55e;color:#fff;padding:.75rem 1.5rem;border-radius:9999px;text-decoration:none;font-size:.875rem;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <h1>You're offline</h1>
  <p>No internet connection. Some pages may still be available from cache. Try again when you're back online.</p>
  <a class="btn" href="/">Try Home</a>
</div>
</body>
</html>
